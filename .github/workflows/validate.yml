name: Validate Syllabus Files

on:
  pull_request:
    paths:
      - "universities/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find changed syllabus files
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- 'universities/**/*.md' | tr '\n' ' ')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed files: $CHANGED"

      - name: Validate
        if: steps.changed.outputs.files != ''
        run: python3 scripts/validate.py ${{ steps.changed.outputs.files }}

      - name: Nothing to validate
        if: steps.changed.outputs.files == ''
        run: echo "No syllabus files changed."
