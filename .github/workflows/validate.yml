name: Validate Syllabus Files

# Validates the whole commons, not just the files a pull request touches.
# Checking only changed files let 202 pre-existing errors sit unnoticed for
# months, and meant a contribution could add a broken file and still pass so
# long as it did not happen to edit an already-broken one.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate every syllabus file
        run: python3 scripts/validate.py
